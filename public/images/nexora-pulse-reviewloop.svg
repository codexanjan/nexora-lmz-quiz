<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050818" />
      <stop offset="100%" stop-color="#02040c" />
    </linearGradient>
    <linearGradient id="pulseRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="loopCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#pBg)" />
  <rect x="1.5" y="1.5" width="1197" height="477" rx="22.5" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Title Area -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2">NOVELTY SYSTEMS</text>
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Learning Pulse™ &amp; ReviewLoop™ Ecosystem</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Transparent, explainable signals computed directly from database telemetry.</text>
  </g>

  <!-- Left: Learning Pulse Gauge Simulation -->
  <g transform="translate(60, 140)">
    <rect width="510" height="280" rx="20" fill="url(#loopCard)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

    <text x="32" y="40" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">⚡ LEARNING PULSE™ (78/100)</text>
    <text x="32" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Objective composite score of syllabus progress &amp; assessment proficiency</text>

    <!-- Signal Breakdown List -->
    <g transform="translate(32, 85)">
      <!-- Signal 1 -->
      <rect width="446" height="40" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)" />
      <circle cx="20" cy="20" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="24" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">+</text>
      <text x="40" y="24" fill="#f8fafc" font-size="12" font-weight="600">Syllabus Completion (13/17 activities)</text>
      <text x="430" y="24" text-anchor="end" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">+76 pts</text>

      <!-- Signal 2 -->
      <g transform="translate(0, 48)">
        <rect width="446" height="40" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)" />
        <circle cx="20" cy="20" r="10" fill="#06b6d4" fill-opacity="0.2" />
        <text x="20" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">+</text>
        <text x="40" y="24" fill="#f8fafc" font-size="12" font-weight="600">Quiz Participation Rate (100% active turnout)</text>
        <text x="430" y="24" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">+15 pts</text>
      </g>

      <!-- Signal 3 -->
      <g transform="translate(0, 96)">
        <rect width="446" height="40" rx="8" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.2)" />
        <circle cx="20" cy="20" r="10" fill="#f43f5e" fill-opacity="0.2" />
        <text x="20" y="24" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="bold">-</text>
        <text x="40" y="24" fill="#f8fafc" font-size="12" font-weight="600">Overdue Module Milestone Penalty</text>
        <text x="430" y="24" text-anchor="end" fill="#fb7185" font-family="monospace" font-size="12" font-weight="bold">-10 pts</text>
      </g>
    </g>
  </g>

  <!-- Right: ReviewLoop Remediation Cards -->
  <g transform="translate(630, 140)">
    <rect width="510" height="280" rx="20" fill="url(#loopCard)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5" />

    <text x="32" y="40" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="700">🔁 REVIEWLOOP™ CONCEPT REMEDIATION</text>
    <text x="32" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Direct link between missed quiz questions and syllabus lessons</text>

    <!-- Loop Concept 1 -->
    <g transform="translate(32, 85)">
      <rect width="446" height="64" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="25" fill="#f8fafc" font-size="13" font-weight="700">Bayes Theorem &amp; Prior Probabilities</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Missed in Machine Learning Foundations (Attempt #1)</text>
      
      <!-- Action button link -->
      <rect x="300" y="16" width="132" height="32" rx="8" fill="#2563eb" />
      <text x="366" y="36" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Study Lesson →</text>
    </g>

    <!-- Loop Concept 2 -->
    <g transform="translate(32, 160)">
      <rect width="446" height="64" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="25" fill="#f8fafc" font-size="13" font-weight="700">Gradient Descent &amp; Learning Rate</text>
      <text x="16" y="44" fill="#94a3b8" font-size="11">Short Answer formulation was partially incomplete</text>
      
      <!-- Action button link -->
      <rect x="300" y="16" width="132" height="32" rx="8" fill="#2563eb" />
      <text x="366" y="36" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="600">Study Lesson →</text>
    </g>
  </g>
</svg>
