<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="24" fill="url(#bgGradient)" />
  <rect width="1200" height="520" rx="24" fill="url(#cyanGlow)" />
  <rect width="1200" height="520" rx="24" fill="url(#purpleGlow)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="480" y1="480" x2="1200" y2="480" />
    <line x1="150" y1="0" x2="150" y2="520" />
    <line x1="300" y1="0" x2="300" y2="520" />
    <line x1="450" y1="0" x2="450" y2="520" />
    <line x1="600" y1="0" x2="600" y2="520" />
    <line x1="750" y1="0" x2="750" y2="520" />
    <line x1="900" y1="0" x2="900" y2="520" />
    <line x1="1050" y1="0" x2="1050" y2="520" />
  </g>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="517" rx="22.5" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Top Status Bar -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <circle cx="16" cy="17" r="5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">100% EXPLAINABLE • ZERO AI</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 115)">
    <!-- Brand Title -->
    <text x="0" y="55" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5">
      NEXORA LEARN
    </text>
    <text x="470" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5">
      PLATFORM
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      Learn smarter. Practice better. Know what to do next.
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="132" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      An interconnected academic ecosystem integrating deterministic learning health signals,
    </text>
    <text x="0" y="154" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      server-authoritative assessments, and concept-driven remediation without opaque black-box AI.
    </text>
  </g>

  <!-- Feature Pillar Badges -->
  <g transform="translate(60, 315)">
    <!-- Badge 1: Learning Pulse -->
    <rect x="0" y="0" width="245" height="54" rx="14" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    <circle cx="28" cy="27" r="12" fill="rgba(6, 182, 212, 0.2)" />
    <text x="28" y="32" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14">⚡</text>
    <text x="50" y="24" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Learning Pulse™</text>
    <text x="50" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Health score (0–100)</text>

    <!-- Badge 2: NextStep Engine -->
    <rect x="260" y="0" width="245" height="54" rx="14" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <circle cx="288" cy="27" r="12" fill="rgba(168, 85, 247, 0.2)" />
    <text x="288" y="32" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14">🧭</text>
    <text x="310" y="24" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">NextStep™ Engine</text>
    <text x="310" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Real DB action recommendations</text>

    <!-- Badge 3: ReviewLoop -->
    <rect x="520" y="0" width="245" height="54" rx="14" fill="url(#cardGrad)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" />
    <circle cx="548" cy="27" r="12" fill="rgba(59, 130, 246, 0.2)" />
    <text x="548" y="32" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">🔁</text>
    <text x="570" y="24" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">ReviewLoop™</text>
    <text x="570" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Concept-to-lesson mastery</text>

    <!-- Badge 4: Server Timing -->
    <rect x="780" y="0" width="245" height="54" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <circle cx="808" cy="27" r="12" fill="rgba(245, 158, 11, 0.2)" />
    <text x="808" y="32" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">⏱️</text>
    <text x="830" y="24" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Strict Server Timing</text>
    <text x="830" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Zero client clock tampering</text>
  </g>

  <!-- Multi-Language Support Showcase (Bottom Bar) -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="1080" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Globe Icon and Label -->
    <circle cx="36" cy="37" r="18" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="36" y="43" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="18">🌐</text>
    
    <text x="68" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Native Multilingual Experience</text>
    <text x="68" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Instant local translations without external AI latency or tokens</text>

    <!-- Language Flags -->
    <g transform="translate(620, 20)">
      <rect x="0" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="34" y="22" text-anchor="middle" font-size="13">🇺🇸 EN</text>

      <rect x="76" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="110" y="22" text-anchor="middle" font-size="13">🇪🇸 ES</text>

      <rect x="152" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="186" y="22" text-anchor="middle" font-size="13">🇫🇷 FR</text>

      <rect x="228" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="262" y="22" text-anchor="middle" font-size="13">🇩🇪 DE</text>

      <rect x="304" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="338" y="22" text-anchor="middle" font-size="13">🇮🇳 HI</text>

      <rect x="380" y="0" width="68" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <text x="414" y="22" text-anchor="middle" font-size="13">🇯🇵 JA</text>
    </g>
  </g>
</svg>
