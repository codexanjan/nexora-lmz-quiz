<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>
    <linearGradient id="teacherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="studentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" rx="24" fill="url(#archBg)" />
  <rect x="1.5" y="1.5" width="1197" height="637" rx="22.5" stroke="rgba(255,255,255,0.1)" stroke-width="3" />

  <!-- Section Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2">SYSTEM ARCHITECTURE</text>
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Interconnected Platform Flow &amp; Data Pipeline</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Zero fragmented silos: courses, assessments, explainable signals, and remediation flow seamlessly.</text>
  </g>

  <!-- Left: Teacher Ecosystem -->
  <g transform="translate(60, 145)">
    <rect width="330" height="440" rx="18" fill="url(#teacherGrad)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5" />
    <rect x="18" y="18" width="180" height="30" rx="8" fill="rgba(59, 130, 246, 0.2)" />
    <text x="32" y="38" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INSTRUCTOR PORTAL</text>

    <!-- Cards inside Teacher -->
    <g transform="translate(18, 64)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Course &amp; Curriculum Builder</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Modules, lessons, video URLs, key takeaways</text>
    </g>

    <g transform="translate(18, 136)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Question Bank (5 Modalities)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Single/Multi choice, T/F, Short Ans, Essay</text>
    </g>

    <g transform="translate(18, 208)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Assessment Versioning</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Immutable Question/Quiz snapshots</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Submissions Queue &amp; Rubrics</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Essay evaluation with GradeRevision history</text>
    </g>

    <g transform="translate(18, 352)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Class Pulse &amp; GapMap™</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Cohort concept deficit &amp; intervention alerts</text>
    </g>
  </g>

  <!-- Center: Core Engine & Rule Engine -->
  <g transform="translate(435, 145)">
    <rect width="330" height="440" rx="18" fill="url(#coreGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    <rect x="18" y="18" width="190" height="30" rx="8" fill="rgba(6, 182, 212, 0.2)" />
    <text x="30" y="38" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DETERMINISTIC CORE</text>

    <!-- Cards inside Core -->
    <g transform="translate(18, 64)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Authoritative Clock Engine</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Server deadline calculation &amp; extra time</text>
    </g>

    <g transform="translate(18, 136)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Autosave &amp; Revision Log</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Optimistic lock, debounced incremental saves</text>
    </g>

    <g transform="translate(18, 208)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Transparent Progress Calc</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Exact completed / required formula ($n/m$)</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Audit Trail &amp; Outbox</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Tamper-proof event logs &amp; notifications</text>
    </g>

    <g transform="translate(18, 352)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Formula Injection Sanitizer</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Neutralizes =, +, -, @ in Gradebook CSV</text>
    </g>
  </g>

  <!-- Right: Student Experience -->
  <g transform="translate(810, 145)">
    <rect width="330" height="440" rx="18" fill="url(#studentGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <rect x="18" y="18" width="180" height="30" rx="8" fill="rgba(16, 185, 129, 0.2)" />
    <text x="32" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STUDENT WORKSPACE</text>

    <!-- Cards inside Student -->
    <g transform="translate(18, 64)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Interactive Syllabus &amp; Video</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Lesson completion directly triggers quizzes</text>
    </g>

    <g transform="translate(18, 136)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Live Quiz Runner</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-tab detection, auto-grading, essay submit</text>
    </g>

    <g transform="translate(18, 208)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">NextStep™ Engine</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Inspects DB state -> guides next best task</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Learning Pulse™ (0–100)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Objective academic health score</text>
    </g>

    <g transform="translate(18, 352)">
      <rect width="294" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">ReviewLoop™ Remediation</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11">Maps missed questions directly back to lessons</text>
    </g>
  </g>

  <!-- Connective Flow Arrows -->
  <path d="M 390 230 L 435 230" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 765 230 L 810 230" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 810 410 L 765 410" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 435 410 L 390 410" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6 4" />
</svg>
